<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 368" width="1200" height="368" role="img" aria-labelledby="t d">
<title id="t">Orgs that used install guidance were about twice as likely to take donations</title><desc id="d">Bar chart: about 49% of orgs that used a guide started taking donations, versus about 22% of orgs that didn&#x27;t.</desc>
<rect x="1" y="1" width="1198" height="366" rx="20" fill="#ffffff" stroke="#e8e5df" stroke-width="2"/>
<text x="48" y="68" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#1a1a2e" text-anchor="start">Orgs that used install guidance were about twice as likely to take donations</text>
<text x="48" y="102" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#556170" text-anchor="start">Share of orgs that started taking donations after publishing an embedded form, 90 days, first half of 2025</text>
<line x1="360.0" y1="136" x2="360.0" y2="268" stroke="#e8e5df" stroke-width="1"/>
<text x="360.0" y="292" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#7a8694" text-anchor="middle">0%</text>
<line x1="527.5" y1="136" x2="527.5" y2="268" stroke="#e8e5df" stroke-width="1"/>
<text x="527.5" y="292" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#7a8694" text-anchor="middle">15%</text>
<line x1="695.0" y1="136" x2="695.0" y2="268" stroke="#e8e5df" stroke-width="1"/>
<text x="695.0" y="292" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#7a8694" text-anchor="middle">30%</text>
<line x1="862.5" y1="136" x2="862.5" y2="268" stroke="#e8e5df" stroke-width="1"/>
<text x="862.5" y="292" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#7a8694" text-anchor="middle">45%</text>
<line x1="1030.0" y1="136" x2="1030.0" y2="268" stroke="#e8e5df" stroke-width="1"/>
<text x="1030.0" y="292" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#7a8694" text-anchor="middle">60%</text>
<text x="340" y="169" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1a1a2e" text-anchor="end">Used at least one guide</text>
<path d="M360,150 H903.1666666666666 Q907.1666666666666,150 907.1666666666666,154 V170 Q907.1666666666666,174 903.1666666666666,174 H360 Z" fill="#013d46"/>
<text x="919.1666666666666" y="170" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1a1a2e" text-anchor="start">~49%</text>
<text x="340" y="243" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1a1a2e" text-anchor="end">Didn&#x27;t use a guide</text>
<path d="M360,224 H601.6666666666666 Q605.6666666666666,224 605.6666666666666,228 V244 Q605.6666666666666,248 601.6666666666666,248 H360 Z" fill="#a9b4bd"/>
<text x="617.6666666666666" y="244" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1a1a2e" text-anchor="start">~22%</text>
<text x="48" y="338" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#7a8694" text-anchor="start">Orgs chose whether to use guides, so this is a strong association, not proof of cause.</text>
</svg>