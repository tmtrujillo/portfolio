<title id="t">Task-first videos hold viewers far longer</title><desc id="d">Range of average share watched for task how-tos (50 to 80%), feature announcements (25 to 35%), and webinar recordings (10 to 15%), with Wistia benchmarks of 43% for 3 to 5 minute videos and 74% for instructional videos.</desc>
