<title id="t">From a 7-minute script to a 3:40 video</title><desc id="d">Process strip: a script of about 1,050 words and 7 minutes, trimmed to about three and a half minutes, a paper edit that reordered already-recorded lines with no re-record, a shot list of 29 screen shots in three sessions, and a final 3:40 cut with on-camera presenter and screen cutaways.</desc>
