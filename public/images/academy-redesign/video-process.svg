<text x="48" y="370" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#7a8694" text-anchor="start">&quot;Use saved templates and linked campaigns,&quot; October 2026. Presenter on camera; I planned the cut, shot the screens, and edited.</text>
