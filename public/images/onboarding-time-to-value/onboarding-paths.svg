<text x="48" y="474" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#7a8694" text-anchor="start">Supported by a live &quot;new user essentials&quot; training, in-app prompts, and day 7, 14, and 30 emails.</text>
