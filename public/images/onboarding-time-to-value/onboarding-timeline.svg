<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">Every touchpoint tied to an onboarding milestone</title><desc id="d">Timeline: day 0 Getting Started path and in-app prompts; day 7 milestone email and live training invite; day 14 and day 30 milestone emails; day 90 success milestone of 50 transactions.</desc>
