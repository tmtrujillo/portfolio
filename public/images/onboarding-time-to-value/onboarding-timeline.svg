<text x="48" y="102" font-family="'Catamaran','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#556170" text-anchor="start">When each piece of onboarding content reaches a new org</text>
<line x1="100" y1="210" x2="1100" y2="210" stroke="#e8e5df" stroke-width="4" stroke-linecap="round"/>
