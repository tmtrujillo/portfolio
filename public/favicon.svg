<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel "T" in highlighter yellow on the site's ink teal. Drawn on a 16px grid so it stays sharp at favicon size. -->
  <rect width="16" height="16" rx="3" fill="#0f2a2e" shape-rendering="geometricPrecision"/>
  <rect x="3" y="3" width="10" height="3" fill="#f2c94c"/>
  <rect x="6" y="6" width="4" height="7" fill="#f2c94c"/>
</svg>
